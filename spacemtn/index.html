<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="Space Mountain Starfield Experience">
  <meta property="og:description" content="A glowing, drifting, twinkling starfield inspired by Disney's Space Mountain queue ambiance.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://madibloom.github.io/spacemtn">

  <meta property="og:site_name" content="Space Mountain Starfield">
  <meta name="twitter:title" content="Space Mountain Starfield Experience">
  <meta name="twitter:description" content="A glowing, drifting, twinkling starfield inspired by Disney's Space Mountain queue ambiance.">

  <title>Space Mountain Star Field</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #111 0%, #000 55%, #000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
    }

    /* Optional subtle “queue” overlay vibe */
    .overlay-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(#0b1a33 1px, transparent 1px),
        linear-gradient(90deg, #0b1a33 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.12;
      mix-blend-mode: screen;
    }

    .overlay-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 80%, rgba(0, 180, 255, 0.25), transparent 55%),
        radial-gradient(circle at 80% 30%, rgba(140, 255, 255, 0.18), transparent 55%);
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <audio src="spacemtn.ogg" autoplay loop hidden></audio>
  
  <canvas id="starfield"></canvas>
  <div class="overlay-grid"></div>
  <div class="overlay-glow"></div>

  <script>
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");

    let stars = [];
    const STAR_COUNT = 350;          // number of stars
    const MAX_SPEED = 0.08;         // base drift speed
    const TWINKLE_SPEED = 0.03;     // how fast brightness oscillates

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resize);
    resize();

    function createStar() {
      const angle = Math.random() * Math.PI * 2;
      const speed = MAX_SPEED + Math.random() * MAX_SPEED;
      const depth = 0.4 + Math.random() * 0.6; // closer vs farther stars

      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: Math.cos(angle) * speed * depth,
        vy: Math.sin(angle) * speed * depth,
        baseRadius: (0.4 + Math.random() * 1.4) * depth,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleOffset: Math.random() * Math.PI * 2,
        hue: 190 + Math.random() * 40, // cool blue/teal range
        depth
      };
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push(createStar());
      }
    }

    initStars();

    function wrapStar(star) {
      if (star.x < 0) star.x += canvas.width;
      if (star.x > canvas.width) star.x -= canvas.width;
      if (star.y < 0) star.y += canvas.height;
      if (star.y > canvas.height) star.y -= canvas.height;
    }

    function drawStar(star, time) {
      // Twinkle: oscillate brightness and radius
      const twinkle =
        0.5 +
        0.5 * Math.sin(time * TWINKLE_SPEED + star.twinklePhase) *
        Math.cos(time * TWINKLE_SPEED * 0.7 + star.twinkleOffset);

      const radius = star.baseRadius * (0.7 + twinkle * 0.6);
      const alpha = 0.35 + twinkle * 0.65;

      const gradient = ctx.createRadialGradient(
        star.x, star.y, 0,
        star.x, star.y, radius * 2.2
      );

      const innerColor = `hsla(${star.hue}, 80%, ${60 + star.depth * 20}%, ${alpha})`;
      const outerColor = `hsla(${star.hue}, 80%, 10%, 0)`;

      gradient.addColorStop(0, innerColor);
      gradient.addColorStop(0.4, innerColor);
      gradient.addColorStop(1, outerColor);

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(star.x, star.y, radius * 2.2, 0, Math.PI * 2);
      ctx.fill();
    }

    let lastTime = 0;

    function animate(timestamp) {
      const time = timestamp / 1000;
      const delta = time - lastTime;
      lastTime = time;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Slight parallax drift to feel like moving through space
      const driftX = Math.sin(time * 0.03) * 0.4;
      const driftY = Math.cos(time * 0.025) * 0.4;

      for (const star of stars) {
        star.x += (star.vx + driftX * star.depth) * (delta * 60);
        star.y += (star.vy + driftY * star.depth) * (delta * 60);
        wrapStar(star);
        drawStar(star, time);
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
