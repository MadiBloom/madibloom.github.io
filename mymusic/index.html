<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Player</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: #d0ffd0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: 0.3s;
  }

  /* LIGHT THEME */
  body.light {
    background: #f2f2f2;
    color: #003300;
  }

  .mymusicplayer {
    width: 380px;
    padding: 20px;
    border-radius: 18px;
    background: rgba(0, 30, 0, 0.8);
    box-shadow: 0 0 25px #00ff00;
    text-align: center;
    transition: 0.3s;
  }

  body.light .mymusicplayer {
    background: #ffffff;
    box-shadow: 0 0 20px #66ff66;
  }

  .avatar-logo {
    width: 140px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 5px #00ff00);
  }

  body.light .avatar-logo {
    filter: drop-shadow(0 0 5px #33aa33);
  }

  .title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #00ff00;
  }

  body.light .title {
    color: #008800;
  }

  audio {
    width: 100%;
    margin-top: 10px;
    filter: drop-shadow(0 0 4px #00ff00);
  }

  body.light audio {
    filter: drop-shadow(0 0 4px #33aa33);
  }

  .theme-btn {
    margin-top: 18px;
    padding: 10px 20px;
    background: #00ff00;
    color: #000;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
  }

  body.light .theme-btn {
    background: #008800;
    color: #fff;
  }

  .theme-btn:hover {
    background: #55ff55;
  }

  body.light .theme-btn:hover {
    background: #44aa44;
  }
</style>
</head>

<body>

<div class="mymusicplayer">
  <img class="avatar-logo" src="https://avatars.githubusercontent.com/u/11810887?v=4&size=256">
  <div class="title">Music Player</div>

  <audio controls>
    <source src="music/TLH_Awaking.ogg" type="audio/ogg">
    Your browser does not support OGG audio.
  </audio>

  <br />

  <audio controls>
    <source src="music/danger_ahead.ogg" type="audio/ogg">
    Your browser does not support OGG audio.
  </audio>

  <button class="theme-btn" onclick="toggleTheme()">Switch Theme</button>
</div>

<script>
  function toggleTheme() {
    document.body.classList.toggle('light');
  }
</script>

</body>
</html>
